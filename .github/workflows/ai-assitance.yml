name: AI-Augmented DevSecOps Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_VERSION: "20"

jobs:

# ============================================================
# STAGE 1 — PROJECT CAPABILITY DETECTION
# ============================================================
  capability-detection:
    name: "🔎 Detect Project Capabilities"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    outputs:
      has_lint: ${{ steps.detect.outputs.has_lint }}
      has_test: ${{ steps.detect.outputs.has_test }}
      has_build: ${{ steps.detect.outputs.has_build }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect capabilities
        id: detect
        working-directory: ${{ matrix.component }}
        run: |

          npm run > scripts.txt || true

          if grep -q "lint" scripts.txt; then
            echo "has_lint=true" >> $GITHUB_OUTPUT
          else
            echo "has_lint=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "test" scripts.txt; then
            echo "has_test=true" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "build" scripts.txt; then
            echo "has_build=true" >> $GITHUB_OUTPUT
          else
            echo "has_build=false" >> $GITHUB_OUTPUT
          fi

          if [ -f Dockerfile ]; then
            echo "has_dockerfile=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerfile=false" >> $GITHUB_OUTPUT
          fi

# ============================================================
# STAGE 2 — QUALITY VALIDATION
# ============================================================
  quality-validation:
    name: "🔍 Quality Validation"
    runs-on: ubuntu-latest
    needs: capability-detection

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        if: needs.capability-detection.outputs.has_lint == 'true'
        working-directory: ${{ matrix.component }}
        run: npm run lint

      - name: Run Unit Tests
        if: needs.capability-detection.outputs.has_test == 'true'
        working-directory: ${{ matrix.component }}
        run: npm test -- --ci

      - name: Run Build
        if: needs.capability-detection.outputs.has_build == 'true'
        working-directory: ${{ matrix.component }}
        run: npm run build

# ============================================================
# STAGE 3 — SBOM GENERATION
# ============================================================
  sbom:
    name: "📦 Generate SBOM"
    runs-on: ubuntu-latest
    needs: quality-validation

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./${{ matrix.component }}
          format: spdx-json
          output-file: "${{ matrix.component }}-sbom.json"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-sbom"
          path: "${{ matrix.component }}-sbom.json"

# ============================================================
# STAGE 4 — VULNERABILITY ANALYSIS
# ============================================================
  vulnerability-analysis:
    name: "🛡️ Vulnerability Analysis"
    runs-on: ubuntu-latest
    needs: sbom

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-sbom"

      - name: Run Grype
        uses: anchore/scan-action@v3
        with:
          sbom: "${{ matrix.component }}-sbom.json"
          fail-build: false
          severity-cutoff: high

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.component }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-vulnerability-results"
          path: trivy-results.json

# ============================================================
# STAGE 5 — GEMINI AI ANALYSIS
# ============================================================
  gemini-analysis:
    name: "🤖 Gemini Compatibility Analysis"
    runs-on: ubuntu-latest
    needs: vulnerability-analysis

    strategy:
      matrix:
        component: [backend, frontend]

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-vulnerability-results"

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-sbom"

      - name: Install Gemini SDK
        run: npm install @google/generative-ai

      - name: Run Gemini Dependency Reasoning
        run: |
          node .github/scripts/gemini-analysis.js \
            "${{ matrix.component }}-sbom.json" \
            "trivy-results.json"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-remediation-plan"
          path: remediation-report.json

# ============================================================
# STAGE 6 — APPLY REMEDIATION
# ============================================================
  remediation:
    name: "🩹 Apply Dependency Remediation"
    runs-on: ubuntu-latest
    needs: gemini-analysis

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-remediation-plan"

      - name: Apply dependency fixes
        run: |
          node .github/scripts/apply-remediation.js \
            remediation-report.json \
            ${{ matrix.component }}

      - name: Install updated dependencies
        working-directory: ${{ matrix.component }}
        run: npm install

      - name: Validate remediation
        working-directory: ${{ matrix.component }}
        run: |

          npm run lint || true
          npm test -- --ci || true
          npm run build || true

# ============================================================
# STAGE 7 — CONTAINER BUILD
# ============================================================
  container-build:
    name: "🐳 Build Containers"
    runs-on: ubuntu-latest
    needs: remediation

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile
        id: dockercheck
        working-directory: ${{ matrix.component }}
        run: |
          if [ -f Dockerfile ]; then
            echo "docker=true" >> $GITHUB_OUTPUT
          else
            echo "docker=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image
        if: steps.dockercheck.outputs.docker == 'true'
        run: |
          docker build \
            -t ${{ matrix.component }}:${{ github.sha }} \
            ./${{ matrix.component }}

# ============================================================
# STAGE 8 — CONTAINER SECURITY
# ============================================================
  container-security:
    name: "🔬 Container Security"
    runs-on: ubuntu-latest
    needs: container-build

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Scan Container
        run: |
          trivy image \
            ${{ matrix.component }}:${{ github.sha }}

# ============================================================
# STAGE 9 — METRICS + THESIS RESULTS
# ============================================================
  thesis-metrics:
    name: "📊 Thesis Metrics"
    runs-on: ubuntu-latest
    needs: container-security

    steps:
      - uses: actions/checkout@v4

      - name: Generate Metrics
        run: |

          mkdir -p metrics

          echo "Pipeline Completed" >> metrics/results.txt
          echo "AI Remediation Executed" >> metrics/results.txt
          echo "Security Validation Completed" >> metrics/results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-metrics
          path: metrics/
