name: AI-Augmented DevSecOps Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:

# ============================================================
# STAGE 1 — PROJECT CAPABILITY DETECTION
# ============================================================
  capability-detection:
    name: "🔎 Detect Project Capabilities"
    runs-on: ubuntu-latest

    outputs:
      capabilities: ${{ steps.detect.outputs.capabilities }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect capabilities
        id: detect
        run: |
          JSON_OUT="{"
          for component in backend frontend; do
            cd "$component"
            npm run > scripts.txt || true

            if grep -q "lint" scripts.txt; then
              has_lint="true"
            else
              has_lint="false"
            fi

            if grep -q "test" scripts.txt; then
              has_test="true"
            else
              has_test="false"
            fi

            if grep -q "build" scripts.txt; then
              has_build="true"
            else
              has_build="false"
            fi

            if [ -f Dockerfile ]; then
              has_dockerfile="true"
            else
              has_dockerfile="false"
            fi

            JSON_OUT="${JSON_OUT}\"${component}\":{\"has_lint\":${has_lint},\"has_test\":${has_test},\"has_build\":${has_build},\"has_dockerfile\":${has_dockerfile}},"
            cd ..
          done
          JSON_OUT="${JSON_OUT%,}}"
          echo "capabilities=${JSON_OUT}" >> $GITHUB_OUTPUT

# ============================================================
# STAGE 2 — QUALITY VALIDATION
# ============================================================
  quality-validation:
    name: "🔍 Quality Validation"
    runs-on: ubuntu-latest
    needs: capability-detection

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        if: fromJSON(needs.capability-detection.outputs.capabilities)[matrix.component].has_lint
        working-directory: ${{ matrix.component }}
        run: npm run lint

      - name: Run Unit Tests
        if: fromJSON(needs.capability-detection.outputs.capabilities)[matrix.component].has_test
        working-directory: ${{ matrix.component }}
        run: npm test -- --ci

      - name: Run Build
        if: fromJSON(needs.capability-detection.outputs.capabilities)[matrix.component].has_build
        working-directory: ${{ matrix.component }}
        run: npm run build

# ============================================================
# STAGE 3 — SBOM GENERATION
# ============================================================
  sbom:
    name: "📦 Generate SBOM"
    runs-on: ubuntu-latest
    needs: quality-validation

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./${{ matrix.component }}
          format: spdx-json
          output-file: "${{ matrix.component }}-sbom.json"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-sbom"
          path: "${{ matrix.component }}-sbom.json"

# ============================================================
# STAGE 4 — VULNERABILITY ANALYSIS
# ============================================================
  vulnerability-analysis:
    name: "🛡️ Vulnerability Analysis"
    runs-on: ubuntu-latest
    needs: sbom

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-sbom"
          path: .

      - name: Run Grype
        uses: anchore/scan-action@v3
        with:
          sbom: "${{ matrix.component }}-sbom.json"
          fail-build: false
          severity-cutoff: high

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.component }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-vulnerability-results"
          path: trivy-results.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Dependency Graph
        working-directory: ${{ matrix.component }}
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm ls --all --json > dependency-graph.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-dependency-graph"
          path: ${{ matrix.component }}/dependency-graph.json

# ============================================================
# STAGE 5 — GEMINI AI ANALYSIS
# ============================================================
  gemini-analysis:
    name: "🤖 Gemini Compatibility Analysis"
    runs-on: ubuntu-latest
    needs: vulnerability-analysis

    strategy:
      matrix:
        component: [backend, frontend]

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-vulnerability-results"
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-sbom"
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-dependency-graph"
          path: .

      - name: Install Gemini SDK
        run: npm install @google/generative-ai --no-save

      - name: Run Gemini Dependency Reasoning
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          node .github/scripts/gemini-analysis.js \
            "$COMPONENT-sbom.json" \
            "trivy-results.json" \
            "dependency-graph.json"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-remediation-plan"
          path: remediation-report.json

# ============================================================
# STAGE 5.5 — RECOMMENDATION VALIDATION
# ============================================================
  recommendation-validation:
    name: "✅ Validate AI Recommendations"
    runs-on: ubuntu-latest
    needs: gemini-analysis

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-remediation-plan"
          path: .

      - name: Validate NPM Registry
        run: |
          node .github/scripts/validate-recommendations.js \
            remediation-report.json \
            validated-remediation-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.component }}-validated-remediation-plan"
          path: validated-remediation-report.json

# ============================================================
# STAGE 6 — APPLY REMEDIATION
# ============================================================
  remediation:
    name: "🩹 Apply Dependency Remediation"
    runs-on: ubuntu-latest
    needs: recommendation-validation

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.component }}-validated-remediation-plan"
          path: .

      - name: Apply dependency fixes
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          node .github/scripts/apply-remediation.js \
            validated-remediation-report.json \
            "$COMPONENT"

      - name: Install updated dependencies
        working-directory: ${{ matrix.component }}
        run: npm install

      - name: Validate remediation
        working-directory: ${{ matrix.component }}
        run: |

          npm run lint || true
          npm test -- --ci || true
          npm run build || true

# ============================================================
# STAGE 7 — CONTAINER BUILD
# ============================================================
  container-build:
    name: "🐳 Build Containers"
    runs-on: ubuntu-latest
    needs: remediation

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile
        id: dockercheck
        working-directory: ${{ matrix.component }}
        run: |
          if [ -f Dockerfile ]; then
            echo "docker=true" >> $GITHUB_OUTPUT
          else
            echo "docker=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image
        if: steps.dockercheck.outputs.docker == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            -t "$COMPONENT:$COMMIT_SHA" \
            "./$COMPONENT"

      - name: Export Docker Image
        if: steps.dockercheck.outputs.docker == 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker save -o ${{ matrix.component }}-image.tar "$COMPONENT:$COMMIT_SHA"

      - uses: actions/upload-artifact@v4
        if: steps.dockercheck.outputs.docker == 'true'
        with:
          name: "${{ matrix.component }}-docker-image"
          path: "${{ matrix.component }}-image.tar"

# ============================================================
# STAGE 8 — CONTAINER SECURITY
# ============================================================
  container-security:
    name: "🔬 Container Security"
    runs-on: ubuntu-latest
    needs: container-build

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker Image
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: "${{ matrix.component }}-docker-image"
          path: .

      - name: Load Docker Image
        id: load_image
        run: |
          if [ -f ${{ matrix.component }}-image.tar ]; then
            docker load -i ${{ matrix.component }}-image.tar
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan Container
        if: steps.load_image.outputs.image_exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ matrix.component }}:${{ github.sha }}"
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

# ============================================================
# STAGE 9 — METRICS + THESIS RESULTS
# ============================================================
  thesis-metrics:
    name: "📊 Thesis Metrics"
    runs-on: ubuntu-latest
    needs: container-security

    steps:
      - uses: actions/checkout@v4

      - name: Generate Metrics
        run: |

          mkdir -p metrics

          echo "Pipeline Completed" >> metrics/results.txt
          echo "AI Remediation Executed" >> metrics/results.txt
          echo "Security Validation Completed" >> metrics/results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-metrics
          path: metrics/
          
