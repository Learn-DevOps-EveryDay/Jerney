name: Experimental DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # PHASE 1: GENERATION & BASELINE
  # ==========================================
  dependency-graphs:
    name: "📊 Generate Dependency Graphs"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ['backend', 'frontend', 'api']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: matrix.component != 'api'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        if: matrix.component == 'api'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate NPM Graph
        if: matrix.component != 'api'
        working-directory: ${{ matrix.component }}
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ls --all --json > ../${{ matrix.component }}-deps.json || true
      
      - name: Generate PyPI Graph
        if: matrix.component == 'api'
        working-directory: ${{ matrix.component }}
        run: |
          echo '{"dependencies": {}}' > ../api-deps.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-deps
          path: ${{ matrix.component }}-deps.json
          retention-days: 1

  vulnerability-scanning:
    name: "🔍 SBOM & Vulnerability Scan (Grype)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ['backend', 'frontend', 'api']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: ./${{ matrix.component }}
          format: spdx-json
          output-file: ${{ matrix.component }}-sbom.spdx.json

      - name: Scan Vulnerabilities (Grype)
        uses: anchore/scan-action@v3
        with:
          sbom: ${{ matrix.component }}-sbom.spdx.json
          output-format: json
          fail-build: false
        id: scan
      
      - name: Rename Grype Output
        run: mv ${{ steps.scan.outputs.json }} ${{ matrix.component }}-grype.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-grype
          path: ${{ matrix.component }}-grype.json
          retention-days: 1

  # ==========================================
  # PHASE 2: ENRICHMENT & REGISTRATION
  # ==========================================
  enrich-and-register:
    name: "📝 Pre-Register Scenarios"
    needs: [dependency-graphs, vulnerability-scanning]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Download Grype Scans
        uses: actions/download-artifact@v4
        with:
          pattern: "*-grype"
          path: grype-results
          merge-multiple: true

      - name: Enrich Findings
        run: node .github/scripts/enrich-findings.js grype-results enriched-findings.json

      - name: Register Scenarios
        run: node .github/scripts/register-scenarios.js enriched-findings.json scenarios.json --min-scenarios=30 --max-scenarios=40
      
      - name: Generate Deterministic Fixes
        run: node .github/scripts/generate-deterministic-fixes.js scenarios.json deterministic-plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: registered-scenarios
          path: |
            enriched-findings.json
            scenarios.json
            deterministic-plan.json
          retention-days: 1

  # ==========================================
  # PHASE 3: AI INFERENCE & VALIDATION
  # ==========================================
  ai-analysis:
    name: "🧠 AI Remediation Inference"
    needs: enrich-and-register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @google/generative-ai
      
      - uses: actions/download-artifact@v4
        with:
          name: registered-scenarios
      
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-deps"
          path: deps-graphs
          merge-multiple: true

      - name: Request AI Recommendations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/gemini-analysis.js scenarios.json deps-graphs raw-ai-plan.json

      - name: Validate Against Registries (NPM/PyPI)
        run: node .github/scripts/validate-recommendations.js raw-ai-plan.json ai-plan.json
      
      - uses: actions/upload-artifact@v4
        with:
          name: ai-plan
          path: ai-plan.json
          retention-days: 1

  # ==========================================
  # PHASE 4: EXPERIMENT RUNNER & METRICS
  # ==========================================
  experiment-runner:
    name: "🧪 Run Validation Gates"
    needs: ai-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Install Grype CLI for Rescan Gate
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - uses: actions/download-artifact@v4
        with:
          name: registered-scenarios
      
      - uses: actions/download-artifact@v4
        with:
          name: ai-plan
      
      - name: Run Experiment
        run: node .github/scripts/run-experiment.js scenarios.json deterministic-plan.json ai-plan.json experiment-results.json

      - name: Collect Metrics
        run: node .github/scripts/collect-metrics.js experiment-results.json thesis-metrics.json

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-results
          path: |
            experiment-results.json
            thesis-metrics.json
          retention-days: 5
