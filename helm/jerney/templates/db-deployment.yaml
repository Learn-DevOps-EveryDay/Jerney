apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jerney-db
  labels:
    app.kubernetes.io/name: jerney-db
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: jerney-db
  selector:
    matchLabels:
      app.kubernetes.io/name: jerney-db
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jerney-db
        app.kubernetes.io/part-of: {{ .Chart.Name }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: jerney-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            {{ toYaml .Values.db.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          livenessProbe:
            exec:
              command:
                - "pg_isready"
                - "-U"
                - {{ .Values.db.auth.username | quote }}
                - "-d"
                - {{ .Values.db.auth.database | quote }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.auth.username | quote }}, "-d", {{ .Values.db.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: jerney-db-pvc
