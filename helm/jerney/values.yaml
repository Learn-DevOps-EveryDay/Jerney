# Default values for jerney.

db:
  image: postgres:16-alpine
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    username: "jerney_user"
    password: "jerney_pass_2026"
    database: "jerney_db"

backend:
  replicaCount: 2
  image: ghcr.io/Learn-DevOps-EveryDay/jerney/jerney-backend:cf53bc7
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

frontend:
  replicaCount: 2
  image: ghcr.io/Learn-DevOps-EveryDay/jerney/jerney-frontend:cf53bc7
  service:
    type: NodePort
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

storageClass:
  create: true
  name: jerney-ebs-sc
  provisioner: ebs.csi.eks.amazonaws.com
  type: gp3
